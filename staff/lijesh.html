<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lijesh Paul - Onflap Technologies</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="shortcut icon" href="/favicon.ico">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <!-- CSS Stylesheet -->
    <link rel="stylesheet" href="style.css">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body data-name="Lijesh Paul" 
      data-title="Director" 
      data-phone="+918113068305" 
      data-email="lijesh@onflap.com" 
      data-website="https://www.onflap.com" 
      data-note="Director at Onflap Technologies, fostering a culture of technological excellence and continuous development and deployment pipelines.">

    <!-- Page Background Decorations: Tracom concentric rings + bottom/top overlapping sweeps -->
    <div class="page-decorations">
        <!-- Top-left concentric rings (High Opacity) -->
        <div class="decor-rings ring-group-1">
            <svg viewBox="0 0 200 200" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
                <circle cx="10" cy="10" r="75" stroke="var(--navy)" stroke-width="8" fill="none" opacity="0.9"/>
                <circle cx="10" cy="10" r="100" stroke="var(--navy)" stroke-width="8" fill="none" opacity="0.9"/>
                <circle cx="130" cy="-10" r="55" stroke="var(--orange)" stroke-width="8" fill="none" opacity="0.9"/>
            </svg>
        </div>

        <!-- Top-center concentric rings (Orange, Subtle) -->
        <div class="decor-rings ring-group-2">
            <svg viewBox="0 0 200 200" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
                <circle cx="100" cy="10" r="60" stroke="var(--orange)" stroke-width="8" fill="none"/>
                <circle cx="100" cy="10" r="85" stroke="var(--orange)" stroke-width="8" fill="none"/>
            </svg>
        </div>

        <!-- Middle-right concentric rings (behind photo, High Opacity) -->
        <div class="decor-rings ring-group-3">
            <svg viewBox="0 0 200 200" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
                <circle cx="190" cy="100" r="75" stroke="var(--orange)" stroke-width="8" fill="none"/>
                <circle cx="190" cy="100" r="100" stroke="var(--navy)" stroke-width="8" fill="none"/>
            </svg>
        </div>

        <!-- Middle-left concentric rings (Orange, Subtle) -->
        <div class="decor-rings ring-group-4">
            <svg viewBox="0 0 200 200" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
                <circle cx="10" cy="100" r="50" stroke="var(--orange)" stroke-width="8" fill="none"/>
                <circle cx="10" cy="100" r="70" stroke="var(--orange)" stroke-width="8" fill="none"/>
            </svg>
        </div>

        <!-- Center-bottom concentric rings (Orange/Grey, Subtle) -->
        <div class="decor-rings ring-group-5">
            <svg viewBox="0 0 200 200" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
                <circle cx="100" cy="100" r="70" stroke="var(--orange)" stroke-width="8" fill="none"/>
                <circle cx="100" cy="100" r="95" stroke="var(--grey)" stroke-width="8" fill="none"/>
            </svg>
        </div>

        <!-- Bottom-left concentric rings (Navy/Orange, High Opacity) -->
        <div class="decor-rings ring-group-6">
            <svg viewBox="0 0 200 200" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
                <circle cx="100" cy="100" r="75" stroke="var(--navy)" stroke-width="8" fill="none"/>
                <circle cx="100" cy="100" r="95" stroke="var(--orange)" stroke-width="8" fill="none"/>
            </svg>
        </div>

        <!-- Bottom-right concentric rings (Grey, Subtle) -->
        <div class="decor-rings ring-group-7">
            <svg viewBox="0 0 200 200" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
                <circle cx="100" cy="100" r="70" stroke="var(--grey)" stroke-width="8" fill="none"/>
            </svg>
        </div>

        <!-- Overlapping bottom waves (Low-Profile Dynamic Red/Black Sweep) -->
        <div class="page-bottom-waves">
            <svg viewBox="0 0 1440 900" width="100%" height="100%" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
                <!-- Solid navy background sweep covering bottom-right (joined with white stripe) -->
                <path d="M 320,900 C 670,850 1010,750 1440,650 L 1440,900 Z" fill="var(--navy)" />
                
                <!-- Main Red ribbon sweep from right to bottom-left -->
                <path d="M 1440,550 C 1000,680 500,800 0,850 L 0,900 L 300,900 C 650,850 1000,750 1440,630 Z" fill="var(--orange)" />
                
                <!-- White stripe separator accent -->
                <path d="M 1440,630 C 1000,750 650,850 300,900 L 320,900 C 670,850 1010,750 1440,638 Z" fill="var(--white)" opacity="0.6" />
                
                <!-- White stroke highlights running parallel to the sweeps -->
                <path d="M 1440,590 Q 1000,710 0,870" stroke="rgba(255,255,255,0.18)" stroke-width="2.5" fill="none" />
                <path d="M 1440,610 Q 1000,730 0,890" stroke="rgba(255,255,255,0.18)" stroke-width="2.5" fill="none" />
            </svg>
        </div>
    </div>

    <!-- Large Background Phoenix Watermark -->
    <svg class="page-watermark" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
        <!-- Bird Body -->
        <path d="M 68 128 C 76 138, 92 142, 105 142 C 120 142, 134 135, 142 124 C 132 128, 120 128, 110 124 C 100 120, 94 112, 94 102 C 94 92, 102 85, 112 85 C 125 85, 134 94, 134 105 C 134 112, 130 118, 124 122 C 138 116, 148 102, 148 85 C 148 62, 128 45, 105 45 C 92 45, 80 52, 74 62 C 84 58, 96 60, 104 68 C 112 76, 114 88, 108 98 C 102 106, 92 110, 82 110 C 70 110, 62 102, 62 90 C 62 80, 68 72, 76 68 C 66 74, 58 86, 58 100 C 58 118, 72 132, 90 132 C 80 132, 72 124, 68 128 Z" fill="var(--orange)" />
        <!-- Wings/Feathers -->
        <path d="M 85 82 C 98 75, 112 75, 125 82 C 132 78, 138 72, 142 65 C 132 70, 122 70, 112 65 C 105 60, 100 52, 100 45 C 92 52, 88 62, 88 72 C 88 76, 89 79, 90 82 Z" fill="var(--orange)" />
        <!-- Beak -->
        <path d="M 125 88 C 127 88, 129 89, 130 90 L 135 88 L 132 93 C 134 95, 134 98, 132 100 C 130 102, 127 102, 125 100 C 123 98, 123 95, 125 93 Z" fill="var(--orange)" />
    </svg>

    <!-- Main Grid Container -->
        <!-- Language Switcher Button (One Click English <-> Arabic) -->
    <div class="lang-toggle-wrap">
        <button id="langToggleBtn" class="btn-lang-toggle" aria-label="Switch to Arabic">
            <i class="fas fa-globe"></i>
            <span class="lang-btn-text">العربية</span>
        </button>
    </div>

    <div class="main-container">
        <!-- Brand Logo Header -->
        <div class="brand-logo-container">
            <img src="/onflap-logo.png" alt="Onflap Logo" class="brand-logo" onerror="this.onerror=null; document.getElementById('logoFallback').style.display='flex'; this.style.display='none';">
            <div id="logoFallback" class="brand-logo-fallback" style="display:none;">
                <i class="fas fa-paper-plane logo-icon"></i>
                <span>ONFLAP</span>
            </div>
        </div>

        <!-- Profile Name & Title -->
        <div class="profile-header">
            <h1 class="profile-name">Lijesh Paul</h1>
            <p class="profile-title">Director</p>
        </div>

        <!-- About Section Card -->
        <div class="about-card">
            <p>Director at Onflap Technologies, fostering a culture of technological excellence and continuous development and deployment pipelines.</p>
        </div>

        <!-- Stacked Contact Details -->
        <div class="contact-list">
            <a href="tel:+918113068305" class="contact-row">
                <div class="contact-icon-box"><i class="fas fa-phone-alt"></i></div>
                <span class="contact-text">+91 81130 68305</span>
            </a>
            
            <a href="mailto:lijesh@onflap.com" class="contact-row">
                <div class="contact-icon-box"><i class="fas fa-envelope"></i></div>
                <span class="contact-text">lijesh@onflap.com</span>
            </a>
            
            <a href="https://www.onflap.com" class="contact-row" target="_blank">
                <div class="contact-icon-box"><i class="fas fa-globe"></i></div>
                <span class="contact-text">www.onflap.com</span>
            </a>
        </div>

        <!-- Action Buttons Side-by-Side -->
        <div class="action-buttons-group">
            <button class="btn btn-save" id="saveContactBtn" onclick="downloadVCard({ name: 'Lijesh Paul', title: 'Director', company: 'Onflap Technologies', phone: '+91 81130 68305', email: 'lijesh@onflap.com', website: 'https://www.onflap.com', address: 'Kerala, India' })" aria-label="Save contact to phonebook">
                <i class="fas fa-address-card"></i> Save Contact
            </button>
            
            <a href="mailto:lijesh@onflap.com" class="btn btn-email" aria-label="Send email to Lijesh">
                <i class="fas fa-paper-plane"></i> Email Me
            </a>
        </div>

        <!-- Portrait Photo Column/Card -->
        <div class="photo-card">
            <picture>
                <source srcset="images/Lijesh.webp" type="image/webp">
                <img src="images/Lijesh.png" alt="Lijesh Paul" class="profile-portrait" loading="eager" decoding="async">
            </picture>
            <div class="photo-placeholder">
                <i class="fas fa-user-tie"></i>
                <span>Place Lijesh.png here</span>
                <p>Copy your photo to the <code>images/</code> folder.</p>
            </div>
        </div>
    </div>

    <!-- Script File -->
    <script type="module" src="./script.js"></script>
</body>
</html>
